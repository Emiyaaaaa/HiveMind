{{- if .Values.migrate.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "agentflow.fullname" . }}-migrate
  labels:
    {{- include "agentflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrate.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.migrate.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "agentflow.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "agentflow.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag }}"
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              i=0
              while [ "$i" -lt 30 ]; do
                uv run alembic upgrade head && exit 0
                i=$((i + 1))
                sleep 2
              done
              exit 1
          env:
            - name: AGENTFLOW_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "agentflow.secretName" . }}
                  key: sqlalchemy-url
{{- end }}
