[project]
name = "agentflow-sdk"
version = "0.1.0"
description = "Python SDK for the AgentFlow HTTP API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentflow_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
