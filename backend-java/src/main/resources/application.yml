spring:
  application:
    name: agentflow-api
  datasource:
    url: ${AGENTFLOW_DATABASE_URL:jdbc:postgresql://localhost:5432/agentflow}
    username: ${AGENTFLOW_DATABASE_USERNAME:agentflow}
    password: ${AGENTFLOW_DATABASE_PASSWORD:agentflow}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${AGENTFLOW_JPA_DDL:validate}
    properties:
      hibernate.jdbc.time_zone: UTC
  data:
    redis:
      host: ${AGENTFLOW_REDIS_HOST:localhost}
      port: ${AGENTFLOW_REDIS_PORT:6379}
  mvc:
    async:
      request-timeout: -1

server:
  port: ${AGENTFLOW_SERVER_PORT:8000}

agentflow:
  version: 0.1.0
  adapters: echo,langgraph
  jobs:
    # Wire protocol: ``streams`` (XADD/XREADGROUP, at-least-once), ``list``
    # (legacy LPUSH/BRPOP), or ``temporal`` (durable long-run workflow).
    # MUST match the Python worker's ``AGENTFLOW_JOBS_IMPL``.
    impl: ${AGENTFLOW_JOBS_IMPL:streams}
    queue-key: agentflow:jobs:runs
  temporal:
    target: ${AGENTFLOW_TEMPORAL_TARGET:localhost:7233}
    namespace: ${AGENTFLOW_TEMPORAL_NAMESPACE:default}
    task-queue: ${AGENTFLOW_TEMPORAL_TASK_QUEUE:agentflow-runs}
    activity-heartbeat-seconds: ${AGENTFLOW_TEMPORAL_ACTIVITY_HEARTBEAT_SECONDS:30}
    activity-start-to-close-seconds: ${AGENTFLOW_TEMPORAL_ACTIVITY_START_TO_CLOSE_SECONDS:604800}
    activity-max-attempts: ${AGENTFLOW_TEMPORAL_ACTIVITY_MAX_ATTEMPTS:5}
  cancel:
    key-prefix: "agentflow:cancel:"
    ttl-seconds: 86400
  events:
    channel-prefix: "agentflow:run:"
    stream-suffix: ":log"
    stream-max-len: 10000
    sse-heartbeat-seconds: 15
  otel:
    enabled: ${AGENTFLOW_OTEL_ENABLED:false}
    service-name: ${AGENTFLOW_OTEL_SERVICE_NAME:agentflow-api}
  auth:
    # Off by default for local/dev. Set AGENTFLOW_AUTH_ENABLED=true and
    # configure keys to enforce tenant isolation + RBAC.
    enabled: ${AGENTFLOW_AUTH_ENABLED:false}
    keys:
      - key: ${AGENTFLOW_API_KEY_ADMIN:dev-admin}
        tenant-id: default
        role: admin
    # OIDC is an additive resource-server authentication method. API keys
    # remain supported, while standard Bearer JWTs are verified against the
    # provider's published JWKS. See docs/oidc.md for a complete example.
    oidc:
      enabled: ${AGENTFLOW_OIDC_ENABLED:false}
      issuer-uri: ${AGENTFLOW_OIDC_ISSUER_URI:}
      jwk-set-uri: ${AGENTFLOW_OIDC_JWK_SET_URI:}
      audience: ${AGENTFLOW_OIDC_AUDIENCE:}
      tenant-claim: ${AGENTFLOW_OIDC_TENANT_CLAIM:tenant_id}
      role-claim: ${AGENTFLOW_OIDC_ROLE_CLAIM:roles}
      default-role: ${AGENTFLOW_OIDC_DEFAULT_ROLE:viewer}
  retention:
    tenant-ttl-days: ${AGENTFLOW_DATA_RETENTION_TENANT_TTL_DAYS:0}
    purge-interval-seconds: ${AGENTFLOW_DATA_RETENTION_PURGE_INTERVAL_SECONDS:3600}
    purge-batch-size: ${AGENTFLOW_DATA_RETENTION_PURGE_BATCH_SIZE:100}

management:
  tracing:
    enabled: ${AGENTFLOW_OTEL_ENABLED:false}
    sampling:
      probability: ${AGENTFLOW_OTEL_TRACE_SAMPLE:1.0}
  otlp:
    tracing:
      endpoint: ${AGENTFLOW_OTEL_EXPORTER_ENDPOINT:http://localhost:4318/v1/traces}
    metrics:
      export:
        enabled: ${AGENTFLOW_OTEL_ENABLED:false}
        url: ${AGENTFLOW_OTEL_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}
        step: 15s
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus

logging:
  level:
    io.agentflow: INFO
    org.springframework.web: INFO
